[package]
name = "os_under1k"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"


[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
path = "src/main.rs"
name = "hobby-os"
test = false
bench = false

[dependencies]
bootloader = "0.9"
spin = "0.10.0"
volatile = "0.2.6"
